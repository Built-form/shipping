service: shipping-serverless

frameworkVersion: '3'
useDotenv: true

provider:
  name: aws
  runtime: nodejs18.x
  region: eu-north-1
  memorySize: 512
  timeout: 900
  apiGateway:
    binaryMediaTypes:
      - 'application/json'
      - '*/*'
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - '*'
      allowedMethods:
        - '*'
      exposedResponseHeaders:
        - X-User-Type
    authorizers:
      googleJwtAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://accounts.google.com
        audience:
          - '1085148951708-8qfkho7ilq084vvpo52jvc6fgg9ecdjt.apps.googleusercontent.com'
  environment:
    # Deployed Lambdas connect through the RDS Proxy (private VPC endpoint) via
    # DB_PROXY_HOST; falls back to the direct instance (DB_HOST) if it's unset.
    # Local runs read .env directly and never see this block, so they stay on
    # DB_HOST = the publicly-reachable direct instance. (Same pattern as joshdex.)
    DB_HOST: ${env:DB_PROXY_HOST, env:DB_HOST}
    DB_USER: ${env:DB_USER}
    DB_PASSWORD: ${env:DB_PASSWORD}
    DB_NAME: ${env:DB_NAME}
    DB_PORT: ${env:DB_PORT}
    MINTSOFT_API_KEY: ${env:MINTSOFT_API_KEY}
    MINTSOFT_CLIENT_ID: ${env:MINTSOFT_CLIENT_ID}
    ASANA_PAT: ${env:ASANA_PAT}
    AMAZON_SP_CLIENT_ID: ${env:AMAZON_SP_CLIENT_ID}
    AMAZON_SP_CLIENT_SECRET: ${env:AMAZON_SP_CLIENT_SECRET}
    AMAZON_SP_REFRESH_TOKEN: ${env:AMAZON_SP_REFRESH_TOKEN}
    AMAZON_SP_CLIENT_ID_HW: ${env:AMAZON_SP_CLIENT_ID_HW}
    AMAZON_SP_CLIENT_SECRET_HW: ${env:AMAZON_SP_CLIENT_SECRET_HW}
    AMAZON_SP_REFRESH_TOKEN_HW: ${env:AMAZON_SP_REFRESH_TOKEN_HW}
    # Hangerworld US (North America) — same HW app, NA-authorized refresh token
    AMAZON_SP_REFRESH_TOKEN_US: ${env:AMAZON_SP_REFRESH_TOKEN_US}
    SHIPSGO_API_KEY: ${env:SHIPSGO_API_KEY}
    MAKE_PO_SENT_WEBHOOK_URL: ${env:MAKE_PO_SENT_WEBHOOK_URL, ''}
    PO_DOCS_BUCKET: shipping-purchase-orders-${sls:stage}
    FRONT_API_TOKEN: ${env:FRONT_API_TOKEN, ''}
    FRONT_CHANNEL_ID: ${env:FRONT_CHANNEL_ID, ''}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY, ''}
    # Email receipt confirmation: optional static page (e.g. an S3-hosted
    # confirmation page) that the "Confirm receipt" click 302-redirects to after
    # recording it. Leave blank to render the built-in thank-you page from the
    # emailReceiptApi Lambda instead.
    EMAIL_RECEIPT_REDIRECT_URL: ${env:EMAIL_RECEIPT_REDIRECT_URL, ''}
    # Absolute base URL (scheme + host) of this API. The interactive confirm
    # endpoint derives it from the inbound request, but the auto-reminder sweep
    # (sendReceiptReminders) has no request — it needs this to build absolute
    # confirm links. Unset → the sweep skips (logs a warning), sending nothing.
    PUBLIC_API_BASE_URL: ${env:PUBLIC_API_BASE_URL, ''}
    # Email-receipt auto-reminders: hours between reminders per email, and the
    # cap on how many to ever send. Set MAX to 0 to disable auto-reminders.
    RECEIPT_REMINDER_INTERVAL_HOURS: ${env:RECEIPT_REMINDER_INTERVAL_HOURS, '48'}
    RECEIPT_REMINDER_MAX: ${env:RECEIPT_REMINDER_MAX, '5'}
    # Front -> Gemini order-status suggestion importer (frontStatusImport).
    # STATUS_IMPORT_DOMAINS: comma-separated extra supplier/forwarder domains
    # and/or full addresses to scan, on top of the suppliers tables. Hardcoded
    # 2026-06-29 from tools/never-processed-domains.js (active supplier domains
    # whose order-linked emails the importer wasn't reaching). CONF_MIN: min
    # Gemini confidence (0..1) to surface a suggestion. MAX_GEMINI: per-run cap.
    STATUS_IMPORT_DOMAINS: 'szsunmed.com,roosin.com,kingphar.cn,yohohangers.com,likesgreen.com,joghninsole.com,dcglogistics.com,owentek.net,owentek.com,fabricfun.cn,china-fk.com,haodymedical.com.cn,tapeningbo.com,ullwin.com,aliyun.com,chinalongbow.com,dynamic-medical.com,intco.com,iso-medical.com.cn,yerconlab.com,youcareyk.com.cn,gxflight.com,medoffice.com.tr,packrich.com,realmould.com,rennington.com.cn,savinodelbene.com,tamhangers.com,aojmedical.com,eurofarm-spa.com,europa-worldwide.com,hangersfactorychina.com,qualityfreight.co.uk,yunhan.ltd,zhende.com,arisen-ltd.com,brightnonwoven.com,china-a2u.cn,healthandbeyond.cn,jiangheyicai.onaliyun.com,mkbmedical.com,mypocdoc.com,nbpassion.com.cn,pengfeihanger.com'
    STATUS_IMPORT_CONF_MIN: ${env:STATUS_IMPORT_CONF_MIN, '0.6'}
    STATUS_IMPORT_MAX_GEMINI: ${env:STATUS_IMPORT_MAX_GEMINI, '40'}
    # Incremental look-back: each run scans since the last fully-drained run minus
    # OVERLAP_HOURS, never further back than MAX_LOOKBACK_DAYS (outage cap).
    STATUS_IMPORT_OVERLAP_HOURS: ${env:STATUS_IMPORT_OVERLAP_HOURS, '6'}
    STATUS_IMPORT_MAX_LOOKBACK_DAYS: ${env:STATUS_IMPORT_MAX_LOOKBACK_DAYS, '7'}
    # Front email → order indexer (frontEmailIndex). Deterministic identifier
    # matching (PO/container/AWB/SKU/lot) over ALL recent Front mail, with a gated
    # Gemini Flash fallback on the no-identifier residual. MAX_GEMINI: per-run Flash
    # cap (cost guard). OVERLAP/MAX_LOOKBACK mirror the status importer's window.
    EMAIL_INDEX_MAX_GEMINI: ${env:EMAIL_INDEX_MAX_GEMINI, '25'}
    EMAIL_INDEX_OVERLAP_HOURS: ${env:EMAIL_INDEX_OVERLAP_HOURS, '6'}
    EMAIL_INDEX_MAX_LOOKBACK_DAYS: ${env:EMAIL_INDEX_MAX_LOOKBACK_DAYS, '30'}
    # Absolute hard ceiling: no run (incremental OR a manual sinceDays backfill)
    # ever indexes email older than this. Six months.
    EMAIL_INDEX_MAX_IMPORT_DAYS: ${env:EMAIL_INDEX_MAX_IMPORT_DAYS, '180'}
    # Remaining tunables (so the deployed Lambda can be retuned via env, not a
    # redeploy — most importantly the Flash model id if the preview is retired).
    EMAIL_INDEX_GEMINI_MODEL: ${env:EMAIL_INDEX_GEMINI_MODEL, 'gemini-3-flash-preview'}
    EMAIL_INDEX_MAX_CONVERSATIONS: ${env:EMAIL_INDEX_MAX_CONVERSATIONS, '4000'}
    EMAIL_INDEX_MAX_PRODUCT_FANOUT: ${env:EMAIL_INDEX_MAX_PRODUCT_FANOUT, '12'}
    EMAIL_INDEX_FUZZY_CAP: ${env:EMAIL_INDEX_FUZZY_CAP, '3'}
    # Shared six-digit code for the PUBLIC carton-scan receiving API
    # (cartonScanApi). Sent on the X-Quick-Auth header; checked in-handler.
    RECEIVING_QUICK_AUTH_CODE: ${env:RECEIVING_QUICK_AUTH_CODE, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            - arn:aws:s3:::shipping-purchase-orders-${sls:stage}/*
  # ── RDS Proxy access (VPC + NAT) ─────────────────────────────────────────
  # Every function joins the VPC so it can reach the shared RDS Proxy's private
  # endpoint (DB_PROXY_HOST). It connects to the SAME proxy / RDS instance as
  # joshdex, so rather than duplicate the networking we REUSE the private
  # subnets joshdex's stack already created (CIDRs 172.31.100-102). Those
  # subnets sit on joshdex's route table, which already sends 0.0.0.0/0 to the
  # NAT Gateway (egress for SP-API / LWA / Mintsoft / ShipsGo / Asana / Front /
  # Gemini) and has the S3 gateway endpoint (free PO-docs S3 access) — so
  # shipping inherits both with zero new resources. Same security group as the
  # proxy (MySQL from itself + all egress). Serverless auto-adds the
  # ec2:*NetworkInterface IAM perms the VPC attachment needs.
  #
  # NOTE: this couples shipping to joshdex's stack for the subnets/NAT —
  # acceptable since both stacks share the same database (explorer RDS instance).
  vpc:
    securityGroupIds:
      - sg-015a76ba77bb50587
    subnetIds:
      - subnet-0182666b07673d609   # 172.31.100.0/24  eu-north-1a
      - subnet-023d894c20f906c27   # 172.31.101.0/24  eu-north-1b
      - subnet-0f684d9b9cb010dfe   # 172.31.102.0/24  eu-north-1c

package:
  individually: true
  patterns:
    - '!.env'
    - '!.git/**'
    - '!node_modules/.cache/**'
    # npm's atomic-install staging dirs (`.<pkg>-<hash>`) left behind by an
    # interrupted `npm install`. Each is a full package copy, so the walker
    # crawls node_modules twice and trips EMFILE on Windows. Never runtime.
    - '!node_modules/.*-*/**'
    # Strip non-runtime files across all of node_modules — TS types, docs, tests,
    # and bin shims add up to thousands of file handles during packaging and
    # trip EMFILE "too many open files" on Windows.
    - '!node_modules/**/*.d.ts'
    - '!node_modules/**/*.md'
    - '!node_modules/**/*.ts'
    - '!node_modules/**/*.map'
    # ESM mirror builds (@aws-sdk/@smithy ship dist-cjs AND dist-es). The Lambda
    # runtime require()s the CJS build, so dist-es is ~1,300 dead files that only
    # inflate the node_modules walk and trip EMFILE on Windows. Never runtime.
    - '!node_modules/**/dist-es/**'
    - '!node_modules/**/system-test/**'
    - '!node_modules/**/test/**'
    - '!node_modules/**/tests/**'
    - '!node_modules/**/__tests__/**'
    - '!node_modules/**/LICENSE*'
    - '!node_modules/**/CHANGELOG*'
    - '!node_modules/**/README*'
    - '!node_modules/**/.github/**'
    - '!node_modules/**/.bin/**'

functions:
  ordersApi:
    handler: src/handlers/orders.handler
    reservedConcurrency: 20
    events:
      # Single greedy catch-all. serverless-http + Express do the real
      # routing inside the Lambda, so every /api/v1/* path and method is
      # handled here — adding an authed endpoint needs only an Express route,
      # no change to this file. The public Lambdas own more-specific prefixes
      # (/confirm-receipt, /portal, /scan) which win by route specificity, so
      # they stay unauthenticated despite this authed catch-all.
      - httpApi:
          path: /api/v1/{proxy+}
          method: '*'
          authorizer:
            name: googleJwtAuthorizer
      # CORS preflight. The '*' (ANY) route above also matches OPTIONS, so
      # preflight would otherwise hit the JWT authorizer and 401 (preflight
      # carries no Authorization header). This more-specific OPTIONS route wins
      # and has NO authorizer, so the browser's preflight succeeds. Express's
      # cors() middleware answers it (API Gateway's own CORS config adds the
      # headers regardless).
      - httpApi:
          path: /api/v1/{proxy+}
          method: OPTIONS

  # ── Supplier "ready date" portal (PUBLIC — no authorizer) ──
  # External suppliers (no Google login) set the estimated ready date on their
  # own PO lines. They authenticate with just their PO number + a per-supplier
  # access code (suppliers.portal_code) — no supplier picker. Isolated in its
  # own handler so the public surface is just these two routes; the code is
  # checked inside the handler, not by API Gateway. Low concurrency caps abuse.
  supplierPortalApi:
    handler: src/handlers/supplier-portal.handler
    reservedConcurrency: 5
    events:
      - httpApi:
          path: /api/v1/portal/po-lookup
          method: POST
      - httpApi:
          path: /api/v1/portal/po-ready-date
          method: POST

  # ── Carton-scan receiving (PUBLIC — no authorizer) ──
  # Warehouse staff receive stock from a carton scan without a Google login.
  # Gated by a single shared six-digit code (RECEIVING_QUICK_AUTH_CODE) on the
  # X-Quick-Auth header, checked inside the handler — not by API Gateway.
  # Isolated in its own function so the public surface is just these routes.
  # Low concurrency + per-route throttling (below) cap abuse.
  cartonScanApi:
    handler: src/handlers/carton-scan.handler
    reservedConcurrency: 5
    events:
      - httpApi:
          path: /api/v1/scan/lookup
          method: POST
      - httpApi:
          path: /api/v1/scan/receive
          method: POST
      - httpApi:
          path: /api/v1/scan/warehouses
          method: GET
      - httpApi:
          path: /api/v1/scan/warehouses/{warehouseId}/locations
          method: GET
      - httpApi:
          path: /api/v1/scan/gemini-key
          method: GET

  # ── Email receipt confirmation (PUBLIC — no authorizer) ──
  # Serves the "Confirm receipt" link embedded in every outbound supplier/
  # forwarder email. The token in the path IS the capability (no login, no
  # access code). Two-step: GET (the emailed link) records a weak "open" and
  # shows a Confirm button; POST (the button press) records the strong
  # "confirmed" — link-scanners fetch the GET but won't submit the form.
  # Isolated so the public surface is just these two routes. Low concurrency +
  # per-route throttling (below) cap abuse.
  emailReceiptApi:
    handler: src/handlers/email-receipt.handler
    reservedConcurrency: 5
    events:
      - httpApi:
          path: /api/v1/confirm-receipt/{token}
          method: GET
      - httpApi:
          path: /api/v1/confirm-receipt/{token}
          method: POST

  stockSnapshot:
    handler: src/handlers/mintsoft-snapshot.handler
    reservedConcurrency: 2
    events:
      - schedule:
          rate: rate(1 hour)
          enabled: true

  # ── Amazon Stock Snapshot: requester ──
  # Runs hourly. Idempotent: only fires POST /reports for missing/FAILED jobs
  # in today's batch. First run of the day kicks off; subsequent runs pick up
  # any that didn't make it through (e.g. rate-limited, Lambda timed out).
  amazonStockRequester:
    handler: src/handlers/amazon-requester.handler
    timeout: 600
    reservedConcurrency: 2
    events:
      - schedule:
          rate: cron(0 7-21 * * ? *)
          enabled: true

  # ── Amazon Stock Snapshot: collector (polls + processes one unit per run) ──
  amazonStockCollector:
    handler: src/handlers/amazon-collector.handler
    reservedConcurrency: 2
    events:
      - schedule:
          rate: cron(0/5 7-21 * * ? *)
          enabled: true
      # Daily backfill sweep after all units should be processed
      - schedule:
          rate: cron(30 21 * * ? *)
          enabled: true
          input: '{"job":"backfill"}'

  importAsanaOrders:
    handler: src/handlers/import-asana-orders.handler
    reservedConcurrency: 2
    events:
      - schedule:
          rate: rate(10 minutes)
          enabled: false

  updateShipsGoEta:
    handler: src/handlers/update-shipsgo-eta.handler
    reservedConcurrency: 2
    events:
      - schedule:
          rate: cron(55 8 * * ? *)
          enabled: true
      - schedule:
          rate: cron(55 11 * * ? *)
          enabled: true
      - schedule:
          rate: cron(55 14 * * ? *)
          enabled: true
      - schedule:
          rate: cron(55 17 * * ? *)
          enabled: true

  mintsoftLocationsSync:
    handler: src/handlers/mintsoft-locations-sync.handler
    timeout: 600
    reservedConcurrency: 1
    events:
      - schedule:
          rate: cron(0 2 * * ? *)
          enabled: true

  shipsgoContainers:
    handler: src/handlers/shipsgo-containers.handler
    timeout: 600
    reservedConcurrency: 1
    events:
      - schedule:
          # Hourly: registration is the billed event, data pulls are free, so
          # tighter polling surfaces ETA slips / milestones sooner at ~zero cost.
          rate: rate(1 hour)
          enabled: true

  shipsgoAir:
    handler: src/handlers/shipsgo-air.handler
    timeout: 600
    reservedConcurrency: 1
    events:
      - schedule:
          rate: rate(1 hour)
          enabled: true

  ordersFromShipsgo:
    handler: src/handlers/orders-from-shipsgo.handler
    timeout: 300
    reservedConcurrency: 1
    events:
      - schedule:
          rate: rate(1 hour)
          enabled: true

  updateImportedDates:
    handler: src/handlers/update-imported-dates.handler
    reservedConcurrency: 2
    events:
      - schedule:
          rate: cron(0 9 * * ? *)
          enabled: true
      - schedule:
          rate: cron(0 12 * * ? *)
          enabled: true
      - schedule:
          rate: cron(0 15 * * ? *)
          enabled: true
      - schedule:
          rate: cron(0 18 * * ? *)
          enabled: true

  # ── QC reports: auto-import from Front ──
  # Pulls new AQI inspection reports (attachment or jianguoyun link) out of Front
  # and analyzes them. Idempotent (dedup on source_ref); empty runs are ~3s.
  # 1024 MB for the jianguoyun zip download + inflate headroom; concurrency 1 so
  # runs never overlap. Inherits the 900s provider timeout for Gemini analysis.
  qcFrontImport:
    handler: src/handlers/qc-front-import.handler
    memorySize: 1024
    reservedConcurrency: 1
    events:
      - schedule:
          rate: rate(1 hour)
          enabled: true

  # ── Front -> Gemini order-status suggestions (hourly) ──
  # Reads recent inbound supplier emails from Front, asks Gemini to infer an
  # order status change (PO_SENT/IN_PRODUCTION/READY/READY_FOR_QC/ON_SEA/ON_AIR),
  # matches the PO to live orders, and queues PENDING 'status_suggestion' alerts
  # in daily_alerts for a human to approve/deny in ShipLine. AI never mutates an
  # order — approval is the authed PATCH /api/v1/alerts/:id/approve route.
  # Idempotent (dedup on front_status_imports.source_ref); a keyword pre-filter +
  # per-run Gemini cap bound cost. 1024 MB + concurrency 1 mirror qcFrontImport;
  # inherits the 900s provider timeout for the per-message Gemini calls.
  frontStatusImport:
    handler: src/handlers/front-status-import.handler
    memorySize: 1024
    reservedConcurrency: 1
    events:
      - schedule:
          rate: rate(1 hour)
          enabled: true

  # ── Front email → order indexer (hourly) ──
  # Walks recent Front conversations (ALL senders), matches known order
  # identifiers (PO / container / AWB / SKU / lot) in the thread text, and writes
  # link rows into order_emails so the UI can list every email about an order
  # (GET /api/v1/orders/:id/emails). Deterministic + a gated Gemini Flash fallback
  # on the residual. Idempotent (per-conversation dedup ledger + watermark); empty
  # runs are ~seconds. 1024 MB + concurrency 1 mirror the other Front importers;
  # inherits the 900s provider timeout for the per-residual Flash calls.
  frontEmailIndex:
    handler: src/handlers/front-email-index.handler
    memorySize: 1024
    reservedConcurrency: 1
    events:
      - schedule:
          rate: rate(1 hour)
          enabled: true

  # ── Daily alerts generator (nightly) ──
  # Aggregates the day's container ETAs + supplier ready dates into the
  # daily_alerts table for the Shipsline slide-out alert window. Runs at 04:00
  # UTC (early-morning UK, after midnight) so "today" (Europe/London) is
  # unambiguous and the latest ETAs are in. Idempotent (INSERT IGNORE on a
  # stable dedup_key); concurrency 1 so a manual invoke can't overlap the tick.
  generateDailyAlerts:
    handler: src/handlers/generate-daily-alerts.handler
    timeout: 300
    reservedConcurrency: 1
    events:
      - schedule:
          rate: cron(0 4 * * ? *)
          enabled: true

  # ── Email-receipt auto-reminders ──
  # Chases suppliers who haven't confirmed receipt of an email. The per-email
  # 48h cadence + max-reminder cap live in SQL (services/receipt-reminders.js),
  # so this ticks every 6h and just re-selects whatever is now due — no
  # over-sending. Reuses each email's original confirm token; the reminder shows
  # its number. concurrency 1 so a manual invoke can't overlap the tick. Needs
  # PUBLIC_API_BASE_URL for absolute confirm links (no request to derive host).
  sendReceiptReminders:
    handler: src/handlers/send-receipt-reminders.handler
    timeout: 300
    reservedConcurrency: 1
    events:
      - schedule:
          rate: rate(6 hours)
          enabled: true

#plugins:
#  - serverless-offline

resources:
  # ── Per-route throttle on the PUBLIC supplier-portal routes ──
  # The supplier portal is unauthenticated and gated only by a per-supplier
  # access code, so throttle brute-force / abuse at the edge (API Gateway
  # returns 429 before the Lambda or DB is touched). RouteSettings is scoped to
  # just these two route keys — a stage-wide DefaultRouteSettings would also
  # throttle the authed admin routes, which we must not do. NOTE: this is a
  # GLOBAL token bucket per route (not per-IP); 5 req/s steady + burst 10 is
  # ample for a handful of suppliers and trivially raised here if needed.
  extensions:
    HttpApiStage:
      # CloudFormation does NOT infer a dependency from a Stage's RouteSettings
      # to the Route resources those keys name. Without this, CFN updates the
      # stage (adding RouteSettings for a brand-new route) in parallel with —
      # often BEFORE — the route itself is created, so the stage update fails
      # with "Unable to find Route by key ..." and the whole deploy rolls back
      # (and the rollback then jams the stack in UPDATE_ROLLBACK_FAILED). Pin an
      # explicit DependsOn on every route key referenced in RouteSettings so the
      # routes always exist first. Add the route's logical id here whenever you
      # add a throttled public route below.
      DependsOn:
        - HttpApiRoutePostApiV1PortalPoDashlookup
        - HttpApiRoutePostApiV1PortalPoDashreadyDashdate
        - HttpApiRouteGetApiV1ConfirmDashreceiptTokenVar
        - HttpApiRoutePostApiV1ConfirmDashreceiptTokenVar
        - HttpApiRoutePostApiV1ScanLookup
        - HttpApiRoutePostApiV1ScanReceive
        - HttpApiRouteGetApiV1ScanWarehouses
        - HttpApiRouteGetApiV1ScanWarehousesWarehouseidVarLocations
        - HttpApiRouteGetApiV1ScanGeminiDashkey
      Properties:
        RouteSettings:
          'POST /api/v1/portal/po-lookup':
            ThrottlingRateLimit: 5
            ThrottlingBurstLimit: 10
          'POST /api/v1/portal/po-ready-date':
            ThrottlingRateLimit: 5
            ThrottlingBurstLimit: 10
          # Public confirm-receipt open (GET) + confirm (POST). Token is
          # unguessable, but throttle the edge anyway to blunt brute-force
          # enumeration.
          'GET /api/v1/confirm-receipt/{token}':
            ThrottlingRateLimit: 5
            ThrottlingBurstLimit: 10
          'POST /api/v1/confirm-receipt/{token}':
            ThrottlingRateLimit: 5
            ThrottlingBurstLimit: 10
          # PUBLIC carton-scan receiving routes — same code-only gating, so
          # throttle brute force at the edge. gemini-key reveals a secret, so
          # it's throttled tighter.
          'POST /api/v1/scan/lookup':
            ThrottlingRateLimit: 5
            ThrottlingBurstLimit: 10
          'POST /api/v1/scan/receive':
            ThrottlingRateLimit: 5
            ThrottlingBurstLimit: 10
          'GET /api/v1/scan/warehouses':
            ThrottlingRateLimit: 5
            ThrottlingBurstLimit: 10
          'GET /api/v1/scan/warehouses/{warehouseId}/locations':
            ThrottlingRateLimit: 5
            ThrottlingBurstLimit: 10
          'GET /api/v1/scan/gemini-key':
            ThrottlingRateLimit: 2
            ThrottlingBurstLimit: 5
  Resources:
    PurchaseOrderDocsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: shipping-purchase-orders-${sls:stage}
        # Public read access via the bucket policy below; ACLs stay locked.
        # Object keys carry a random UUID so URLs are unguessable in practice.
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: false
          IgnorePublicAcls: true
          RestrictPublicBuckets: false
        # CORS so the SPA can fetch() object bytes cross-origin (e.g. download a
        # PI to sign + re-upload). Direct links/navigation never needed CORS;
        # programmatic fetch/XHR does. Objects are already public-read, so GET/
        # HEAD from any origin matches the existing exposure.
        CorsConfiguration:
          CorsRules:
            - AllowedMethods:
                - GET
                - HEAD
                - PUT
              AllowedOrigins:
                - '*'
              AllowedHeaders:
                - '*'
              ExposedHeaders:
                - ETag
                - Content-Length
                - Content-Type
                - Content-Disposition
              MaxAge: 3000
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    PurchaseOrderDocsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref PurchaseOrderDocsBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${PurchaseOrderDocsBucket.Arn}/*'
